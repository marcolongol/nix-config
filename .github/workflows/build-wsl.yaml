---
name: Build WSL Distro
on:
  push:
    branches:
      - main
    paths:
      - flake.lock
      - hosts/nixos-wsl/**
      - roles/common.nix
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_wsl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: cachix/install-nix-action@616559265b40713947b9c190a8ff4b507b5df49b  # v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Build tarball builder
        id: builder
        run: |
          out=$(nix build --no-link --print-out-paths .#nixosConfigurations.nixos-wsl.config.system.build.tarballBuilder)
          echo "path=$out/bin/nixos-wsl-tarball-builder" >> "$GITHUB_OUTPUT"

      # Builder needs root to set file ownership inside the tarball.
      - name: Build nixos.wsl
        run: sudo "${{ steps.builder.outputs.path }}" nixos.wsl

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: nixos-wsl-${{ github.sha }}
          path: nixos.wsl
          # Already gzipped.
          compression-level: 0
          if-no-files-found: error
