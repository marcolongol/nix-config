---
name: Check Flakes
on:
  pull_request:
    branches:
      - main
  # Direct pushes too: comin deploys main, so it must pass the same checks.
  push:
    branches:
      - main

jobs:
  check_flakes:
    runs-on: ubuntu-latest
    steps:
      - uses: 1password/load-secrets-action/configure@92467eb28f72e8255933372f1e0707c567ce2259  # v4
        with:
          # Secrets go to this step only, not the whole workflow's env.
          connect-host: ${{ secrets.OP_CONNECT_HOST }}
          connect-token: ${{ secrets.OP_CONNECT_TOKEN }}

      - uses: 1password/load-secrets-action@92467eb28f72e8255933372f1e0707c567ce2259  # v4
        id: op
        with:
          # Step outputs, not exported env: later steps (flake check, fmt,
          # renovate) must not see the App's private key.
          export-env: false
        env:
          BOT_APP_ID: op://homelab/GITHUB/GITHUB_APP_ID
          BOT_APP_PRIVATE_KEY: op://homelab/GITHUB/GITHUB_APP_PRIVATE_KEY

      - name: Generate Token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        id: app-token
        with:
          app-id: "${{ steps.op.outputs.BOT_APP_ID }}"
          private-key: "${{ steps.op.outputs.BOT_APP_PRIVATE_KEY }}"

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          token: "${{ steps.app-token.outputs.token }}"

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b  # v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - run: nix flake check

      - name: Check formatting
        run: nix fmt -- --check .

      # flake check skips homeConfigurations.
      - name: Evaluate standalone home configurations
        run: |
          for u in $(nix eval --json .#homeConfigurations --apply builtins.attrNames | jq -r '.[]'); do
            nix eval --raw ".#homeConfigurations.$u.activationPackage.drvPath"
          done
